summary = Hermes + OpenCode + ChatGPT Accessibility
description = """Merged NVDA accessibility for Hermes Agent, OpenCode Desktop, and the ChatGPT desktop app. 2.8.8: Codex message navigation works globally; background left/right changes only NVDA's transcript buffer, while foreground left/right identifies the task actually shown in ChatGPT before moving and opening the adjacent task. Arrow cycling is limited to running or seven-day-recent tasks. 2.8.7: project/task pickers remain available when ChatGPT is closed; selection cold-starts ChatGPT, waits asynchronously for its verified window and renderer, then applies the normal link and buffer target. 2.8.6: removed duplicate project/task list speech and made the pickers available outside ChatGPT while its verified desktop window is open; selections restore ChatGPT before normal opening and buffer targeting. 2.8.5: task lists, cycling, and Auto-Read use Codex's actual generated or assigned task name instead of the opening message. 2.8.4: fixed the wxPython Timer.Notify callback that drives Codex Auto-Read. 2.8.3: Codex Auto-Read is global whenever enabled, with no foreground or remembered-window gate. Each active top-level transcript has an independent stable offset, and each update is a separate NVDA-priority utterance so concurrent tasks cannot hide one another inside combined speech. Collapsed activity summaries are read without expansion, the completion monitor uses an owned periodic timer, NVDA+Alt+Left/Right changes only the manual transcript buffer, and completion is announced even when Auto-Read is off. 2.7.1: consumer Chat announces assistant activity cards while it waits, then reads the completed response. 2.7.0: NVDA+Alt+Enter sends through consumer Chat and automatically reads the completed response. 2.6.1: restored compatibility with NVDA 2026.1, whose embedded Python omits SQLite. 2.6.0: added active-task browsing and confirmed banked usage-reset redemption. 2.5.0: merged Codex Accessibility and updated desktop detection for ChatGPT.exe. 2.4.1: reduced OpenCode polling and accessibility-tree load. 2.4.0: removed the destabilizing OpenCode app.asar patcher. 2.1.0: added the self-healing Hermes app.asar patcher."""
